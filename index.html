<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --surface: #111827;
            --surface-card: #1f2937;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #38bdf8;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
            --success: #10b981;
            --error: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Выбор уровней */
        .levels-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            max-width: 500px;
            width: 100%;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .levels-container::-webkit-scrollbar {
            display: none;
        }

        .level-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .level-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        /* Игровое поле */
        .game-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .grid-box {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            aspect-ratio: 1;
            gap: 3px;
            background: var(--border);
            padding: 3px;
            border-radius: 10px;
            max-width: 320px;
            margin: 0 auto;
            width: 100%;
        }

        .cell {
            position: relative;
            background: #030712;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.empty {
            background: var(--surface);
            opacity: 0.1;
            pointer-events: none;
        }

        .cell input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }

        .cell input:focus {
            background: rgba(99, 102, 241, 0.2);
        }

        .cell-num {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 8px;
            font-weight: 700;
            color: var(--accent);
            pointer-events: none;
        }

        /* Вопросы */
        .clues-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .clues-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .clues-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .clues-list li {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface-card);
            padding: 6px 10px;
            border-radius: 6px;
            border-left: 2px solid var(--primary);
        }

        .clues-list li b {
            color: var(--text);
        }

        /* Кнопки */
        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary { background: var(--surface-card); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-secondary:hover { color: var(--text); }

        .btn-success { background: var(--success); color: white; }

        #status-msg {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Кроссворд</h1>
        <p>Уровень <span id="current-lvl-num">1</span> из 5</p>
    </header>

    <div class="levels-container" id="levels-bar"></div>

    <div class="game-wrapper">
        <div class="grid-box" id="crossword-grid"></div>

        <div class="clues-section">
            <div>
                <h3>По горизонтали</h3>
                <ul class="clues-list" id="horizontal-clues"></ul>
            </div>
            <div>
                <h3>По вертикали</h3>
                <ul class="clues-list" id="vertical-clues"></ul>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="clearGrid()">Очистить</button>
            <button class="btn btn-primary" onclick="checkGrid()">Проверить</button>
            <button class="btn btn-success" id="next-btn" style="display:none;" onclick="nextLevel()">Далее ➔</button>
        </div>
        <div id="status-msg"></div>
    </div>

    <script>
        // Четкая сетка 5х5 с жестким пересечением букв
        const levelsData = [
            {
                size: 5,
                h: [
                    { id: 1, text: "Печатное издание с текстом.", row: 0, col: 0, word: "КНИГА" },
                    { id: 2, text: "Предмет мебели для работы.", row: 4, col: 0, word: "СТОЛ" }
                ],
                v: [
                    { id: 3, text: "Школьное помещение для уроков.", row: 0, col: 0, word: "КЛАСС" },
                    { id: 4, text: "Сборник географических карт.", row: 0, col: 4, word: "АТЛАС" }
                ]
            },
            {
                size: 5,
                h: [
                    { id: 1, text: "Самое холодное время года.", row: 0, col: 0, word: "ЗИМА" },
                    { id: 2, text: "Замерзшая вода.", row: 4, col: 0, word: "ЛЕД" }
                ],
                v: [
                    { id: 3, text: "Гладкая отражающая поверхность.", row: 0, col: 0, word: "ЗЕРКАЛО".slice(0,5) },
                    { id: 4, text: "Легковой автомобиль.", row: 0, col: 3, word: "АВТО" }
                ]
            },
            {
                size: 5,
                h: [
                    { id: 1, text: "Естественный водный поток.", row: 0, col: 0, word: "РЕКА" },
                    { id: 2, text: "Сооружение через реку.", row: 4, col: 0, word: "МОСТ" }
                ],
                v: [
                    { id: 3, text: "Животное в воде с жабрами.", row: 0, col: 0, word: "РЫБА" },
                    { id: 4, text: "Водная глубокая артерия.", row: 0, col: 3, word: "КАНАЛ" }
                ]
            },
            {
                size: 5,
                h: [
                    { id: 1, text: "Управляет самолетом.", row: 0, col: 0, word: "ПИЛОТ" },
                    { id: 2, text: "Орган управления на судне.", row: 4, col: 1, word: "РУЛЬ" }
                ],
                v: [
                    { id: 3, text: "Мелкие сыпучие крупинки пляжа.", row: 0, col: 0, word: "ПЕСОК" },
                    { id: 4, text: "Машина с шашечками.", row: 0, col: 4, word: "ТАКСИ" }
                ]
            },
            {
                size: 5,
                h: [
                    { id: 1, text: "Ученический рабочий стол.", row: 0, col: 0, word: "ПАРТА" },
                    { id: 2, text: "Белый брусок для доски.", row: 4, col: 1, word: "МЕЛ" }
                ],
                v: [
                    { id: 3, text: "Воинская крупная часть.", row: 0, col: 0, word: "ПОЛК" },
                    { id: 4, text: "Дорожка с рядами деревьев.", row: 0, col: 4, word: "АЛЛЕЯ" }
                ]
            }
        ];

        let activeLevel = 0;
        let gridMatrix = [];

        function initLevelsBar() {
            const bar = document.getElementById('levels-bar');
            bar.innerHTML = '';
            levelsData.forEach((_, idx) => {
                let chip = document.createElement('div');
                chip.className = `level-chip ${idx === activeLevel ? 'active' : ''}`;
                chip.innerText = `Ур. ${idx + 1}`;
                chip.onclick = () => loadLevel(idx);
                bar.appendChild(chip);
            });
        }

        function loadLevel(idx) {
            activeLevel = idx;
            document.getElementById('current-lvl-num').innerText = idx + 1;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('status-msg').innerText = '';
            initLevelsBar();
            buildMatrix(levelsData[idx]);
            renderUI();
        }

        function buildMatrix(data) {
            gridMatrix = Array(5).fill(null).map(() => Array(5).fill(null));

            // Заполняем горизонтальные слова
            data.h.forEach(item => {
                for (let i = 0; i < item.word.length; i++) {
                    let r = item.row;
                    let c = item.col + i;
                    if (r < 5 && c < 5) {
                        if (!gridMatrix[r][c]) {
                            gridMatrix[r][c] = { letter: item.word[i], num: (i === 0 ? item.id : null) };
                        } else {
                            if (i === 0) gridMatrix[r][c].num = item.id;
                            gridMatrix[r][c].letter = item.word[i];
                        }
                    }
                }
            });

            // Заполняем вертикальные слова
            data.v.forEach(item => {
                for (let i = 0; i < item.word.length; i++) {
                    let r = item.row + i;
                    let c = item.col;
                    if (r < 5 && c < 5) {
                        if (!gridMatrix[r][c]) {
                            gridMatrix[r][c] = { letter: item.word[i], num: (i === 0 ? item.id : null) };
                        } else {
                            if (i === 0) gridMatrix[r][c].num = item.id;
                            gridMatrix[r][c].letter = item.word[i];
                        }
                    }
                }
            });
        }

        function renderUI() {
            const gridEl = document.getElementById('crossword-grid');
            gridEl.innerHTML = '';

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let cellData = gridMatrix[r][c];
                    let cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';

                    if (cellData === null) {
                        cellDiv.classList.add('empty');
                    } else {
                        if (cellData.num) {
                            let numSpan = document.createElement('span');
                            numSpan.className = 'cell-num';
                            numSpan.innerText = cellData.num;
                            cellDiv.appendChild(numSpan);
                        }

                        let input = document.createElement('input');
                        input.maxLength = 1;
                        input.dataset.r = r;
                        input.dataset.c = c;

                        input.addEventListener('input', (e) => {
                            if (e.target.value.length === 1) {
                                let nextInput = gridEl.querySelector(`input[data-r="${r}"][data-c="${c+1}"]`) ||
                                                gridEl.querySelector(`input[data-r="${r+1}"][data-c="${c}"]`);
                                if (nextInput) nextInput.focus();
                            }
                        });

                        cellDiv.appendChild(input);
                    }
                    gridEl.appendChild(cellDiv);
                }
            }

            const curData = levelsData[activeLevel];
            document.getElementById('horizontal-clues').innerHTML = curData.h.map(i => `<li><b>${i.id}.</b> ${i.text}</li>`).join('');
            document.getElementById('vertical-clues').innerHTML = curData.v.map(i => `<li><b>${i.id}.</b> ${i.text}</li>`).join('');
        }

        function checkGrid() {
            let inputs = document.querySelectorAll('.grid-box input');
            let allCorrect = true;
            let filledCount = 0;

            inputs.forEach(input => {
                let r = input.dataset.r;
                let c = input.dataset.c;
                let correctLetter = gridMatrix[r][c].letter;
                let userVal = input.value.toUpperCase();

                if (userVal !== '') {
                    filledCount++;
                    if (userVal === correctLetter) {
                        input.style.color = 'var(--success)';
                    } else {
                        input.style.color = 'var(--error)';
                        allCorrect = false;
                    }
                } else {
                    allCorrect = false;
                }
            });

            let msg = document.getElementById('status-msg');
            if (filledCount === 0) {
                msg.style.color = '#f59e0b';
                msg.innerText = 'Заполните клетки!';
            } else if (allCorrect) {
                msg.style.color = 'var(--success)';
                msg.innerText = 'Кроссворд решен верно!';
                if (activeLevel < levelsData.length - 1) {
                    document.getElementById('next-btn').style.display = 'block';
                }
            } else {
                msg.style.color = 'var(--error)';
                msg.innerText = 'Есть ошибки в буквах.';
            }
        }

        function clearGrid() {
            document.querySelectorAll('.grid-box input').forEach(input => {
                input.value = '';
                input.style.color = 'white';
            });
            document.getElementById('status-msg').innerText = '';
            document.getElementById('next-btn').style.display = 'none';
        }

        function nextLevel() {
            if (activeLevel < levelsData.length - 1) {
                loadLevel(activeLevel + 1);
            }
        }

        loadLevel(0);
    </script>
</body>
</html>
