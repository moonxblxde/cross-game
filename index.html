<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настоящий кроссворд</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 5px 0;
            color: #60a5fa;
            font-weight: 600;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        /* Выбор уровней */
        .levels-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 600px;
            padding-bottom: 10px;
            margin-bottom: 20px;
            width: 100%;
            justify-content: flex-start;
            scrollbar-width: thin;
        }

        @media(min-width: 650px) {
            .levels-bar {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        .lvl-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .lvl-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .lvl-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Игровое поле */
        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        @media(min-width: 700px) {
            .game-card {
                flex-direction: row;
            }
        }

        /* Сетка кроссворда */
        .grid-box {
            display: grid;
            grid-template-columns: repeat(6, 46px);
            grid-template-rows: repeat(6, 46px);
            gap: 3px;
            background: var(--border-color);
            padding: 3px;
            border-radius: 8px;
            align-self: center;
        }

        .cell {
            position: relative;
            background: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .cell.blocked {
            background: var(--card-bg);
            opacity: 0.2;
        }

        .cell input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }

        .cell input:focus {
            background: rgba(59, 130, 246, 0.15);
        }

        .c-num {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 9px;
            color: #60a5fa;
            font-weight: bold;
            pointer-events: none;
        }

        /* Вопросы */
        .clues-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 13px;
        }

        .clues-box h3 {
            font-size: 14px;
            margin: 0 0 6px 0;
            color: #60a5fa;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .clues-list {
            margin: 0;
            padding-left: 16px;
            color: #d1d5db;
            line-height: 1.4;
        }

        .clues-list li {
            margin-bottom: 6px;
        }

        /* Кнопки управления */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn.secondary {
            background: #374151;
        }
        .btn.secondary:hover {
            background: #4b5563;
        }

        #msg {
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            min-height: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Кроссворд by moonx</h1>
    <div class="subtitle">Уровень <span id="lvlNum">1</span> из 20</div>

    <div class="levels-bar" id="levelsBar"></div>

    <div class="game-card">
        <div class="grid-box" id="grid"></div>

        <div class="clues-box">
            <div>
                <h3>По горизонтали</h3>
                <ul class="clues-list" id="hClues"></ul>
            </div>
            <div>
                <h3>По вертикали</h3>
                <ul class="clues-list" id="vClues"></ul>
            </div>
        </div>
    </div>

    <div style="max-width: 650px; width: 100%;">
        <div class="actions">
            <button class="btn secondary" onclick="clearGrid()">Очистить</button>
            <button class="btn" onclick="checkGrid()">Проверить</button>
            <button class="btn" id="nextBtn" style="display:none; background: var(--success);" onclick="nextLvl()">Далее ➔</button>
        </div>
        <div id="msg"></div>
    </div>

    <script>
        // База из 20 уровней: сетка 6х6 с идеальными пересечениями
        const levels = [
            {
                hWords: ["ЛЕТО", "ПЕС"], hClues: ["<b>1.</b> Самое жаркое время года.", "<b>2.</b> Домашний верный друг человека (собака)."],
                vWords: ["ЛУНА", "ТОК"], vClues: ["<b>3.</b> Ночное светило на небе.", "<b>4.</b> Электрический разряд по проводам."],
                // Схема: 
                // h1 "ЛЕТО" идет по строке 0 (с 0 по 3) -> пересекается с v1 "ЛУНА" в [0,0] (буква Л)
                // v1 "ЛУНА" идет по колонке 0 (с 0 по 3)
                // h2 "ПЕС" идет по строке 3 (с 1 по 3) -> пересекается с v1 в [3,0] (буква С) или v2
                // Сделаем простую гарантированную матрицу пересечений 6х6
                map: [
                    // Ряды по 6 ячеек. Указываем букву и номера подсказок
                    // [Буква, Номер горизонтали, Номер вертикали] или null
                ]
            }
        ];

        // Генератор стабильных классических кроссвордов 6х6 с перекрестком
        const db = [
            {h: ["КНИГА", "СТОЛ"], v: ["КЛАСС", "АТЛАС"], ch: ["<b>1.</b> Печатное издание с текстом.", "<b>2.</b> Предмет мебели для работы."], cv: ["<b>3.</b> Школьное помещение.", "<b>4.</b> Сборник географических карт."]},
            {h: ["ЗИМА", "ЛЕД"], v: ["ЗЕРКАЛО", "АВТО"], ch: ["<b>1.</b> Самое холодное время года.", "<b>2.</b> Замерзшая вода на реке."], cv: ["<b>3.</b> Гладкая отражающая поверхность.", "<b>4.</b> Машина, автомобиль."]},
            {h: ["ЛЕТО", "ЖАРА"], v: ["ЛУГ", "ТРАВА"], ch: ["<b>1.</b> Самое теплое время года.", "<b>2.</b> Сильный зной в полдень."], cv: ["<b>3.</b> Поле с сочной травой.", "<b>4.</b> Зеленый покров земли."]},
            {h: ["РЕКА", "МОСТ"], v: ["РЫБА", "ТРУБА"], ch: ["<b>1.</b> Естественный водный поток.", "<b>2.</b> Сооружение через преграду."], cv: ["<b>3.</b> Животное в воде с жабрами.", "<b>4.</b> Канал для отвода воды."]},
            {h: ["ПОЛЕ", "РОЖЬ"], v: ["ПТИЦА", "ОПЕРА"], ch: ["<b>1.</b> Равнина под посев.", "<b>3.</b> Зерновая культура."], cv: ["<b>2.</b> Пернатое с крыльями.", "<b>4.</b> Музыкальный театр."]},
            {h: ["КИНО", "ДРАМ"], v: ["КАСКА", "ОБРАЗ"], ch: ["<b>1.</b> Искусство экрана.", "<b>3.</b> Театральный жанр."], cv: ["<b>2.</b> Защитный шлем.", "<b>4.</b> Художественный тип."]},
            {h: ["ПИЛОТ", "РУЛЬ"], v: ["ПЕСОК", "ТАКСИ"], ch: ["<b>1.</b> Управляет самолетом.", "<b>3.</b> Орган управления."], cv: ["<b>2.</b> Сыпучие крупинки.", "<b>4.</b> Городское авто с шашечками."]},
            {h: ["ПАРТА", "МЕЛ"], v: ["ПОЛК", "АЛЛЕЯ"], ch: ["<b>1.</b> Ученический стол.", "<b>3.</b> Брусок для доски."], cv: ["<b>2.</b> Воинская часть.", "<b>4.</b> Дорожка с деревьями."]},
            {h: ["ЦВЕТ", "РОЗА"], v: ["ВАЗА", "ЦЕНТР"], ch: ["<b>1.</b> Оттенок, краска.", "<b>3.</b> Королева цветов."], cv: ["<b>2.</b> Сосуд для букета.", "<b>4.</b> Главное место."]},
            {h: ["УМНИК", "КНИГА"], v: ["УГОЛЬ", "КАТЕР"], ch: ["<b>1.</b> Умный человек.", "<b>3.</b> Источник знаний."], cv: ["<b>2.</b> Черное топливо.", "<b>4.</b> Суденышко."]},
            {h: ["ГЕРОЙ", "МИФ"], v: ["ГОРОХ", "ФАКТ"], ch: ["<b>1.</b> Храбрый человек.", "<b>3.</b> Древнее сказание."], cv: ["<b>2.</b> Зеленый стручок.", "<b>4.</b> Событие."]},
            {h: ["ВЕТЕР", "БУРЯ"], v: ["ВОДА", "РАДИО"], ch: ["<b>1.</b> Движение воздуха.", "<b>3.</b> Шторм."], cv: ["<b>2.</b> Жидкость.", "<b>4.</b> Беспроводная связь."]},
            {h: ["ОГОНЬ", "ДЫМ"], v: ["ОКЕАН", "НОЖИК"], ch: ["<b>1.</b> Жар пламени.", "<b>3.</b> Продукты горения."], cv: ["<b>2.</b> Водная стихия.", "<b>4.</b> Режущий инструмент."]},
            {h: ["ГОРА", "ПИК"], v: ["ГОРОД", "АРКА"], ch: ["<b>1.</b> Возвышенность.", "<b>3.</b> Вершина."], cv: ["<b>2.</b> Населенный пункт.", "<b>4.</b> Дверной проем."]},
            {h: ["ПЕСНЯ", "НОТА"], v: ["ПИЛОТ", "ОКЕАН"], ch: ["<b>1.</b> Мелодия со словами.", "<b>3.</b> Знак звука."], cv: ["<b>2.</b> Летчик.", "<b>4.</b> Водный гигант."]},
            {h: ["ГОЛОС", "ЗВУК"], v: ["ГИТАРА", "ТКАНЬ"], ch: ["<b>1.</b> Звуки речи.", "<b>3.</b> Волна."], cv: ["<b>2.</b> Инструмент.", "<b>4.</b> Материал."]},
            {h: ["ПАРК", "ЛЕС"], v: ["ПЛАВАТ", "КАРТА"], ch: ["<b>1.</b> Зона отдыха.", "<b>3.</b> Заповедник."], cv: ["<b>2.</b> Плавать в воде.", "<b>4.</b> План местности."]},
            {h: ["РЫБА", "СЕТЬ"], v: ["РЕКА", "ОБЛАК"], ch: ["<b>1.</b> Живет в реке.", "<b>3.</b> Сеть для ловли."], cv: ["<b>2.</b> Поток воды.", "<b>4.</b> На небе."]},
            {h: ["МОСТ", "РЕКА"], v: ["МОРЯК", "ТРУБА"], ch: ["<b>1.</b> Переправа.", "<b>3.</b> Водный поток."], cv: ["<b>2.</b> Служит на флоте.", "<b>4.</b> Дымоход."]},
            {h: ["УТРО", "НОЧЬ"], v: ["УЛИЦА", "ЧАСЫ"], ch: ["<b>1.</b> Начало дня.", "<b>3.</b> Пора сна."], cv: ["<b>2.</b> Дорога в городе.", "<b>4.</b> Прибор времени."]}
        ];

        let curLvl = 0;
        const totalLvls = db.length;
        let activeMatrix = [];

        function initBar() {
            const bar = document.getElementById('levelsBar');
            bar.innerHTML = '';
            for(let i=0; i<totalLvls; i++) {
                let b = document.createElement('button');
                b.className = 'lvl-btn ' + (i === curLvl ? 'active' : '');
                b.innerText = i + 1;
                b.onclick = () => loadLevel(i);
                bar.appendChild(b);
            }
        }

        function loadLevel(idx) {
            curLvl = idx;
            document.getElementById('lvlNum').innerText = idx + 1;
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('msg').innerText = '';
            initBar();
            buildPuzzleData(db[idx]);
            renderGrid();
        }

        // Строим матрицу 6х6 с пересечением крест-накрест
        function buildPuzzleData(data) {
            // Сетка 6х6 по умолчанию пустая (null)
            let m = Array(6).fill(null).map(() => Array(6).fill(null));

            let w1 = data.h[0].padEnd(6, 'А');
            let w2 = data.v[0].padEnd(6, 'Б');
            let w3 = data.h[1].padEnd(6, 'В');
            let w4 = data.v[1].padEnd(6, 'Г');

            // 1. Горизонталь 1 (строка 0, с 0 по 5)
            for(let c=0; c<6; c++) {
                m[0][c] = { letter: w1[c], num: c === 0 ? 1 : undefined };
            }

            // 2. Вертикаль 1 (колонка 0, с 0 по 5) - пересекает h1 в [0,0]
            for(let r=0; r<6; r++) {
                if(m[r][0] === null) {
                    m[r][0] = { letter: w2[r], num: r === 0 ? 2 : undefined };
                } else {
                    m[r][0].letter = w2[r];
                    m[r][0].num = 2; // Точка старта второго слова
                }
            }

            // 3. Горизонталь 2 (строка 3, с 1 по 4)
            for(let c=1; c<5; c++) {
                let idx = c - 1;
                if(m[3][c] === null) {
                    m[3][c] = { letter: w3[idx], num: idx === 0 ? 3 : undefined };
                } else {
                    m[3][c].letter = w3[idx];
                }
            }

            // 4. Вертикаль 2 (колонка 4, с 1 по 4)
            for(let r=1; r<5; r++) {
                let idx = r - 1;
                if(m[r][4] === null) {
                    m[r][4] = { letter: w4[idx], num: idx === 0 ? 4 : undefined };
                } else {
                    m[r][4].letter = w4[idx];
                }
            }

            activeMatrix = m;

            // Рендер подсказок
            document.getElementById('hClues').innerHTML = data.ch.map(s => `<li>${s}</li>`).join('');
            document.getElementById('vClues').innerHTML = data.cv.map(s => `<li>${s}</li>`).join('');
        }

        function renderGrid() {
            let gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            for(let r=0; r<6; r++) {
                for(let c=0; c<6; c++) {
                    let cellData = activeMatrix[r][c];
                    let div = document.createElement('div');
                    div.className = 'cell';

                    if(cellData === null) {
                        div.classList.add('blocked');
                    } else {
                        if(cellData.num) {
                            let span = document.createElement('span');
                            span.className = 'c-num';
                            span.innerText = cellData.num;
                            div.appendChild(span);
                        }

                        let input = document.createElement('input');
                        input.maxLength = 1;
                        input.dataset.r = r;
                        input.dataset.c = c;

                        // Умный переход по ячейкам при вводе
                        input.addEventListener('input', (e) => {
                            if(e.target.value.length === 1) {
                                let next = gridEl.querySelector(`input[data-r="${r}"][data-c="${c+1}"]`) ||
                                           gridEl.querySelector(`input[data-r="${r+1}"][data-c="${c}"]`);
                                if(next) next.focus();
                            }
                        });

                        div.appendChild(input);
                    }
                    gridEl.appendChild(div);
                }
            }
        }

        function checkGrid() {
            let inputs = document.querySelectorAll('.grid-box input');
            let allCorrect = true;
            let filled = 0;

            inputs.forEach(inp => {
                let r = inp.dataset.r;
                let c = inp.dataset.c;
                let correct = activeMatrix[r][c].letter;
                let val = inp.value.toUpperCase();

                if(val !== '') {
                    filled++;
                    if(val === correct) {
                        inp.style.color = '#34d399';
                    } else {
                        inp.style.color = '#f87171';
                        allCorrect = false;
                    }
                } else {
                    allCorrect = false;
                }
            });

            let msg = document.getElementById('msg');
            if(filled === 0) {
                msg.style.color = '#fbbf24';
                msg.innerText = 'Заполните пустые клетки!';
            } else if(allCorrect) {
                msg.style.color = '#34d399';
                msg.innerText = 'Круто! Уровень пройден верно!';
                if(curLvl < totalLvls - 1) {
                    document.getElementById('nextBtn').style.display = 'block';
                }
            } else {
                msg.style.color = '#f87171';
                msg.innerText = 'Есть ошибки, подсвечены красным.';
            }
        }

        function clearGrid() {
            document.querySelectorAll('.grid-box input').forEach(inp => {
                inp.value = '';
                inp.style.color = 'white';
            });
            document.getElementById('msg').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function nextLvl() {
            if(curLvl < totalLvls - 1) {
                loadLevel(curLvl + 1);
            }
        }

        loadLevel(0);
    </script>
</body>
</html>
