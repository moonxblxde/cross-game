<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кроссворд: 20 Уровней</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 2px;
            font-size: 20px;
        }
        .level-select {
            margin-bottom: 8px;
        }
        select {
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 45px);
            grid-template-rows: repeat(6, 45px);
            gap: 3px;
            justify-content: center;
            margin: 10px 0;
        }
        .cell-wrapper {
            position: relative;
            width: 45px;
            height: 45px;
        }
        .cell {
            width: 45px;
            height: 45px;
            background-color: #1e293b;
            border: 2px solid #475569;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            box-sizing: border-box;
        }
        .cell:focus {
            border-color: #38bdf8;
            background-color: #334155;
        }
        .cell.disabled {
            background-color: #05070c;
            border-color: #05070c;
            pointer-events: none;
        }
        .cell-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #38bdf8;
            font-weight: bold;
            pointer-events: none;
        }
        .task-box {
            text-align: left;
            background: #1e293b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.4;
            border: 1px solid #334155;
        }
        .task-box b {
            color: #38bdf8;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }
        .btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }
        .btn-green {
            background-color: #10b981;
        }
        .msg {
            margin-top: 8px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧠 КРОССВОРД by moonx</h1>
        <div class="level-select">
            Уровень: <select id="levelSelect" onchange="changeLevel(this.value)"></select>
        </div>

        <!-- Сетка 6x6 -->
        <div class="grid" id="grid"></div>

        <div class="task-box" id="taskBox"></div>

        <div class="buttons">
            <button class="btn btn-green" onclick="checkLevel()">Проверить</button>
            <button class="btn" onclick="nextLevel()" id="nextBtn" style="display:none;">Следующий ➔</button>
        </div>
        <div class="msg" id="msg"></div>
    </div>

    <script>
        // Четкая база из 20 уровней с координатами, номерами и вопросами
        const levels = [
            {
                tasks: ["1. Горная цепь или преграда (ГОРА)", "2. Праздничный десерт (ТОРТ)"],
                words: [
                    {word: "гора", r: 0, c: 0, dir: "H", num: 1},
                    {word: "торт", r: 0, c: 2, dir: "V", num: 2}
                ]
            },
            {
                tasks: ["1. Крупное водное пространство (МОРЕ)", "2. Ночное светило (ЛУНА)"],
                words: [
                    {word: "море", r: 0, c: 0, dir: "H", num: 1},
                    {word: "луна", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Источник знаний (КНИГА)", "2. Кинотеатр или сеанс (КИНО)"],
                words: [
                    {word: "книга", r: 0, c: 0, dir: "H", num: 1},
                    {word: "кино", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Полосатый хищник (ТИГР)", "2. Проверка знаний (ТЕСТ)"],
                words: [
                    {word: "тигр", r: 0, c: 0, dir: "H", num: 1},
                    {word: "тест", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Стоянка кораблей (ПОРТ)", "2. Часть лица или органа (РОТ)"],
                words: [
                    {word: "порт", r: 0, c: 0, dir: "H", num: 1},
                    {word: "рот", r: 0, c: 2, dir: "V", num: 2}
                ]
            },
            {
                tasks: ["1. Круглый предмет (ШАР)", "2. Громкие звуки (ШУМ)"],
                words: [
                    {word: "шар", r: 0, c: 0, dir: "H", num: 1},
                    {word: "шум", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Железный инструмент (ЛОМ)", "2. Время года или полет (ЛЕТ)"],
                words: [
                    {word: "лом", r: 0, c: 0, dir: "H", num: 1},
                    {word: "лет", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. От костра или сигареты (ДЫМ)", "2. Крепкое дерево (ДУБ)"],
                words: [
                    {word: "дым", r: 0, c: 0, dir: "H", num: 1},
                    {word: "дуб", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Ледяные осадки (ГРАД)", "2. Женщина или карта (ДАМА)"],
                words: [
                    {word: "град", r: 0, c: 0, dir: "H", num: 1},
                    {word: "дама", r: 0, c: 2, dir: "V", num: 2}
                ]
            },
            {
                tasks: ["1. Место для прогулок (ПАРК)", "2. Часть лица (РОТ)"],
                words: [
                    {word: "парк", r: 0, c: 0, dir: "H", num: 1},
                    {word: "рот", r: 0, c: 2, dir: "V", num: 2}
                ]
            },
            {
                tasks: ["1. Сила или мощь (СИЛА)", "2. Цифра и число (НОЛЬ)"],
                words: [
                    {word: "сила", r: 0, c: 0, dir: "H", num: 1},
                    {word: "ноль", r: 0, c: 2, dir: "V", num: 2}
                ]
            },
            {
                tasks: ["1. Поле для посевов (ПОЛЕ)", "2. Речной рак (РАК)"],
                words: [
                    {word: "поле", r: 0, c: 0, dir: "H", num: 1},
                    {word: "рак", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Столица Франции (ПАРИЖ)", "2. Отрезок времени (ВЕК)"],
                words: [
                    {word: "париж", r: 0, c: 0, dir: "H", num: 1},
                    {word: "век", r: 0, c: 2, dir: "V", num: 2}
                ]
            },
            {
                tasks: ["1. Музыкальный звук (ЗВУК)", "2. Белая масса (МЕЛ)"],
                words: [
                    {word: "звук", r: 0, c: 0, dir: "H", num: 1},
                    {word: "мел", r: 0, c: 3, dir: "V", num: 2}
                ]
            },
            {
                tasks: ["1. Детская игра (ИГРА)", "2. Швейный инструмент (ИГЛА)"],
                words: [
                    {word: "игра", r: 0, c: 0, dir: "H", num: 1},
                    {word: "игла", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Сладкий напиток (СОК)", "2. Фруктовый сад (САД)"],
                words: [
                    {word: "сок", r: 0, c: 0, dir: "H", num: 1},
                    {word: "сад", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Часть тела (РУКА)", "2. Красивый цветок (РОЗА)"],
                words: [
                    {word: "рука", r: 0, c: 0, dir: "H", num: 1},
                    {word: "роза", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Чертеж или план (ПЛАН)", "2. Птичье перо (ПЕРО)"],
                words: [
                    {word: "план", r: 0, c: 0, dir: "H", num: 1},
                    {word: "перо", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Царский трон (ТРОН)", "2. Дождевая туча (ТУЧА)"],
                words: [
                    {word: "трон", r: 0, c: 0, dir: "H", num: 1},
                    {word: "туча", r: 0, c: 0, dir: "V", num: 1}
                ]
            },
            {
                tasks: ["1. Зимняя буря (БУРЯ)", "2. Спортивный бой (БОЙ)"],
                words: [
                    {word: "буря", r: 0, c: 0, dir: "H", num: 1},
                    {word: "бой", r: 0, c: 0, dir: "V", num: 1}
                ]
            }
        ];

        let currentLevel = 0;
        const selectEl = document.getElementById("levelSelect");

        for (let i = 0; i < levels.length; i++) {
            let opt = document.createElement("option");
            opt.value = i;
            opt.innerText = `Уровень ${i + 1}`;
            selectEl.appendChild(opt);
        }

        function changeLevel(idx) {
            currentLevel = parseInt(idx);
            selectEl.value = currentLevel;
            loadLevel();
        }

        function loadLevel() {
            let lvl = levels[currentLevel];
            document.getElementById("taskBox").innerHTML = `<b>Задания:</b><br>` + lvl.tasks.join("<br>");
            document.getElementById("msg").innerText = "";
            document.getElementById("nextBtn").style.display = "none";

            let grid = document.getElementById("grid");
            grid.innerHTML = "";

            // Строим карту ответов и номеров
            let solution = {};
            let numbers = {};

            lvl.words.forEach(item => {
                let r = item.r;
                let c = item.c;
                numbers[`${r}-${c}`] = item.num;

                for (let i = 0; i < item.word.length; i++) {
                    let cr = r, cc = c;
                    if (item.dir === "H") cc += i;
                    else cr += i;
                    solution[`${cr}-${cc}`] = item.word[i];
                }
            });

            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    let wrapper = document.createElement("div");
                    wrapper.className = "cell-wrapper";

                    let input = document.createElement("input");
                    input.className = "cell";
                    input.maxLength = 1;
                    input.dataset.r = r;
                    input.dataset.c = c;

                    let key = `${r}-${c}`;
                    if (solution[key]) {
                        input.dataset.answer = solution[key];
                        if (numbers[key]) {
                            let numSpan = document.createElement("span");
                            numSpan.className = "cell-number";
                            numSpan.innerText = numbers[key];
                            wrapper.appendChild(numSpan);
                        }
                    } else {
                        input.classList.add("disabled");
                    }

                    input.addEventListener("input", (e) => {
                        let val = e.target.value.toLowerCase();
                        e.target.value = val;
                        if (val && e.target.parentElement.nextElementSibling) {
                            let nextInput = e.target.parentElement.nextElementSibling.querySelector(".cell:not(.disabled)");
                            if (nextInput) nextInput.focus();
                        }
                    });

                    wrapper.appendChild(input);
                    grid.appendChild(wrapper);
                }
            }
        }

        function checkLevel() {
            let inputs = document.querySelectorAll('.cell:not(.disabled)');
            let correct = true;

            inputs.forEach(input => {
                let ans = input.dataset.answer;
                if (input.value.toLowerCase() !== ans) {
                    correct = false;
                    input.style.borderColor = "#ef4444";
                } else {
                    input.style.borderColor = "#10b981";
                }
            });

            let msg = document.getElementById("msg");
            if (correct) {
                msg.style.color = "#10b981";
                msg.innerText = "🎉 Красава! Всё верно!";
                if (currentLevel < levels.length - 1) {
                    document.getElementById("nextBtn").style.display = "inline-block";
                }
            } else {
                msg.style.color = "#ef4444";
                msg.innerText = "❌ Есть ошибки в буквах.";
            }
        }

        function nextLevel() {
            if (currentLevel < levels.length - 1) {
                currentLevel++;
                selectEl.value = currentLevel;
                loadLevel();
            }
        }

        loadLevel();
    </script>
</body>
</html>
