<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Классический кроссворд (20 уровней)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .level-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .level-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .level-btn:hover {
            background-color: #334155;
            color: #fff;
        }

        .level-btn.active {
            background-color: #0284c7;
            color: #fff;
            border-color: #38bdf8;
        }

        .game-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid #334155;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 45px);
            grid-template-rows: repeat(8, 45px);
            gap: 2px;
            background-color: #334155;
            padding: 3px;
            border: 2px solid #475569;
            border-radius: 6px;
        }

        .cell {
            position: relative;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.blocked {
            background-color: #1e293b;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            background: transparent;
            color: #f8fafc;
            outline: none;
        }

        .cell input:focus {
            background-color: #334155;
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 10px;
            color: #38bdf8;
            pointer-events: none;
            font-weight: bold;
        }

        .clues-container {
            flex: 1;
            min-width: 300px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .clues-container h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            font-size: 16px;
        }

        .clues-container ul {
            padding-left: 18px;
            line-height: 1.4;
        }

        .clues-container li {
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .btn-container {
            margin-top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .action-btn {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background-color: #0284c7;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: #0369a1;
        }

        .action-btn.secondary {
            background-color: #475569;
        }

        .action-btn.secondary:hover {
            background-color: #334155;
        }

        #message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h1>Классический кроссворд by MOONX</h1>
    <p style="color: #94a3b8; margin-top: 0; font-size: 14px;">Уровень <span id="currentLevelNum">1</span> из 20</p>

    <!-- Выбор уровней -->
    <div class="level-selector" id="levelSelector"></div>

    <div class="game-container">
        <!-- Сетка кроссворда 8x8 -->
        <div class="grid-container" id="crosswordGrid"></div>

        <!-- Подсказки -->
        <div class="clues-container">
            <h3>По горизонтали</h3>
            <ul id="horizontalClues"></ul>

            <h3>По вертикали</h3>
            <ul id="verticalClues"></ul>
        </div>
    </div>

    <div class="btn-container">
        <button class="action-btn secondary" onclick="resetCurrentLevel()">Очистить</button>
        <button class="action-btn" onclick="checkCrossword()">Проверить</button>
        <button class="action-btn" id="nextLevelBtn" onclick="nextLevel()" style="display:none;">Следующий уровень</button>
    </div>

    <div id="message"></div>

    <script>
        // База из 20 уровней со словарями нормальной сложности и пересечениями
        const levelsData = [
            {
                h: ["<b>1.</b> Печатное издание для чтения.", "<b>3.</b> Предмет мебели для работы."],
                v: ["<b>2.</b> Школьное помещение для уроков.", "<b>4.</b> Познавательная деятельность."],
                words: { h1: "КНИГА", h2: "СТОЛ", v1: "КЛАСС", v2: "НАУКА" }
            },
            {
                h: ["<b>1.</b> Музыкальное произведение со словами.", "<b>3.</b> Знак звука в нотном стане."],
                v: ["<b>2.</b> Тот, кто управляет самолетом.", "<b>4.</b> Городской легковой автомобиль."],
                words: { h1: "ПЕСНЯ", h2: "НОТА", v1: "ПИЛОТ", v2: "ТАКСИ" }
            },
            {
                h: ["<b>1.</b> Звуки, издаваемые при речи или пении.", "<b>3.</b> Физическое волновое явление."],
                v: ["<b>2.</b> Струнный музыкальный инструмент.", "<b>4.</b> Крупнейший водный резервуар."],
                words: { h1: "ГОЛОС", h2: "ЗВУК", v1: "ГИТАРА", v2: "ОКЕАН" }
            },
            {
                h: ["<b>1.</b> Зеленая зона отдыха в городе.", "<b>3.</b> Дикая заросшая территория."],
                v: ["<b>2.</b> Передвижение в водной среде.", "<b>4.</b> Географическое изображение местности."],
                words: { h1: "ПАРК", h2: "ЛЕС", v1: "ПЛАВАТ", v2: "КАРТА" }
            },
            {
                h: ["<b>1.</b> Животное, живущее в воде.", "<b>3.</b> Рыболовная снасть или паутина."],
                v: ["<b>2.</b> Быстрый естественный водный поток.", "<b>4.</b> Материал для пошива одежды."],
                words: { h1: "РЫБА", h2: "СЕТЬ", v1: "РЕКА", v2: "ТКАНЬ" }
            },
            {
                h: ["<b>1.</b> Сооружение для перехода через преграду.", "<b>3.</b> Водный поток, впадающий в море."],
                v: ["<b>2.</b> Человек, служащий на флоте.", "<b>4.</b> Канал для отвода воды или газа."],
                words: { h1: "МОСТ", h2: "РЕКА", v1: "МОРЯК", v2: "ТРУБА" }
            },
            {
                h: ["<b>1.</b> Движение воздуха в атмосфере.", "<b>3.</b> Сильный разрушительный шторм."],
                v: ["<b>2.</b> Прозрачная жидкость без вкуса.", "<b>4.</b> Беспроводное средство связи."],
                words: { h1: "ВЕТЕР", h2: "БУРЯ", v1: "ВОДА", v2: "РАДИО" }
            },
            {
                h: ["<b>1.</b> Свет и жар от пламени.", "<b>3.</b> Продукты горения вверх."],
                v: ["<b>2.</b> Огромное водное пространство.", "<b>4.</b> Маленький режущий предмет."],
                words: { h1: "ОГОНЬ", h2: "ДЫМ", v1: "ОКЕАН", v2: "НОЖИК" }
            },
            {
                h: ["<b>1.</b> Высокое поднятие суши.", "<b>3.</b> Верхняя точка вершины."],
                v: ["<b>2.</b> Крупный населенный пункт.", "<b>4.</b> Архитектурный проем."],
                words: { h1: "ГОРА", h2: "ПИК", v1: "ГОРОД", v2: "АРКА" }
            },
            {
                h: ["<b>1.</b> Самое холодное время года.", "<b>3.</b> Замерзшая гладкая вода."],
                v: ["<b>2.</b> Гладкая отражающая поверхность.", "<b>4.</b> Дорожное транспортное средство."],
                words: { h1: "ЗИМА", h2: "ЛЕД", v1: "ЗЕРКАЛ", v2: "АВТО" }
            },
            {
                h: ["<b>1.</b> Самое теплое время года.", "<b>3.</b> Сильный летний зной."],
                v: ["<b>2.</b> Заливное ровное поле.", "<b>4.</b> Зеленые стебли растений."],
                words: { h1: "ЛЕТО", h2: "ЖАРА", v1: "ЛУГ", v2: "ТРАВА" }
            },
            {
                h: ["<b>1.</b> Безлесная равнина под посев.", "<b>3.</b> Зерновая хлебная культура."],
                v: ["<b>2.</b> Пернатое животное с крыльями.", "<b>4.</b> Музыкальный театр."],
                words: { h1: "ПОЛЕ", h2: "РОЖЬ", v1: "ПТИЦА", v2: "ОПЕРА" }
            },
            {
                h: ["<b>1.</b> Ночное светило, спутник Земли.", "<b>3.</b> Легкое птичье перо."],
                v: ["<b>2.</b> Изгиб реки или луг.", "<b>4.</b> Начало нового дня."],
                words: { h1: "ЛУНА", h2: "ПЕРО", v1: "ЛУКА", v2: "УТРО" }
            },
            {
                h: ["<b>1.</b> Искусство движущихся картинок.", "<b>3.</b> Театральный жанр переживаний."],
                v: ["<b>2.</b> Защитный головной убор.", "<b>4.</b> Художественное отображение."],
                words: { h1: "КИНО", h2: "ДРАМ", v1: "КАСКА", v2: "ОБРАЗ" }
            },
            {
                h: ["<b>1.</b> Бумажное послание адресату.", "<b>3.</b> Связная последовательность фраз."],
                v: ["<b>2.</b> Оттиск штемпеля или типография.", "<b>4.</b> Реплика на вопрос."],
                words: { h1: "ПИСЬМО", h2: "ТЕКСТ", v1: "ПЕЧАТЬ", v2: "ОТВЕТ" }
            },
            {
                h: ["<b>1.</b> Член экипажа самолета.", "<b>3.</b> Орган управления направлением."],
                v: ["<b>2.</b> Мелкие сыпучие крупинки.", "<b>4.</b> Машина с таксометром."],
                words: { h1: "ПИЛОТ", h2: "РУЛЬ", v1: "ПЕСОК", v2: "ТАКСИ" }
            },
            {
                h: ["<b>1.</b> Школьный стол для учеников.", "<b>3.</b> Белый брусок для доски."],
                v: ["<b>2.</b> Воинское соединение.", "<b>4.</b> Дорожка в парке с деревьями."],
                words: { h1: "ПАРТА", h2: "МЕЛ", v1: "ПОЛК", v2: "АЛЛЕЯ" }
            },
            {
                h: ["<b>1.</b> Зрительное восприятие оттенков.", "<b>3.</b> Королева садовых цветов."],
                v: ["<b>2.</b> Сосуд для срезанных цветов.", "<b>4.</b> Главная срединная часть."],
                words: { h1: "ЦВЕТ", h2: "РОЗА", v1: "ВАЗА", v2: "ЦЕНТР" }
            },
            {
                h: ["<b>1.</b> Образованный человек.", "<b>3.</b> Источник знаний в переплете."],
                v: ["<b>2.</b> Горное топливо черного цвета.", "<b>4.</b> Быстроходное суднышко."],
                words: { h1: "УМНИК", h2: "КНИГА", v1: "УГОЛЬ", v2: "КАТЕР" }
            },
            {
                h: ["<b>1.</b> Храбрый человек, совершивший подвиг.", "<b>3.</b> Древнее сказание о богах."],
                v: ["<b>2.</b> Огородное бобовое растение.", "<b>4.</b> Реальное достоверное событие."],
                words: { h1: "ГЕРОЙ", h2: "МИФ", v1: "ГОРОХ", v2: "ФАКТ" }
            }
        ];

        let currentLevelIndex = 0;
        const totalLevels = levelsData.length;
        let currentLevelData = null;

        // Построение матричной сетки 8х8 с правильным пересечением слов в углах и точках стыка
        function buildLevelData(index) {
            const data = levelsData[index];
            const grid = Array(8).fill(null).map(() => Array(8).fill(null));

            let w1 = data.words.h1.padEnd(8, 'А').slice(0, 8);
            let w2 = data.words.v1.padEnd(8, 'Б').slice(0, 8);
            let w3 = data.words.h2.padEnd(8, 'В').slice(0, 8);
            let w4 = data.words.v2.padEnd(8, 'Г').slice(0, 8);

            // 1. Горизонталь 1 (строка 0)
            for(let c=0; c<8; c++) {
                if(c < data.words.h1.length) {
                    grid[0][c] = { l: w1[c], n: c===0?1:undefined };
                }
            }

            // 2. Вертикаль 1 (колонка 0) - пересекает h1 в ячейке [0,0]
            for(let r=0; r<8; r++) {
                if(r < data.words.v1.length) {
                    if(grid[r][0] === null) {
                        grid[r][0] = { l: w2[r], n: r===0?2:undefined };
                    } else {
                        grid[r][0].l = w2[r]; // точка пересечения
                        grid[r][0].n = 2; // номер для вертикали
                    }
                }
            }

            // 3. Горизонталь 2 (строка 4)
            for(let c=2; c<2+data.words.h2.length; c++) {
                let charIdx = c - 2;
                if(grid[4][c] === null) {
                    grid[4][c] = { l: w3[charIdx], n: charIdx===0?3:undefined };
                } else {
                    grid[4][c].l = w3[charIdx];
                }
            }

            // 4. Вертикаль 2 (колонка 5)
            for(let r=1; r<1+data.words.v2.length; r++) {
                let charIdx = r - 1;
                if(grid[r][5] === null) {
                    grid[r][5] = { l: w4[charIdx], n: charIdx===0?4:undefined };
                } else {
                    grid[r][5].l = w4[charIdx];
                }
            }

            return {
                grid: grid,
                h: data.h,
                v: data.v
            };
        }

        const gridElement = document.getElementById('crosswordGrid');

        function initLevelSelector() {
            const selector = document.getElementById('levelSelector');
            selector.innerHTML = '';
            for (let i = 0; i < totalLevels; i++) {
                const btn = document.createElement('button');
                btn.classList.add('level-btn');
                if (i === currentLevelIndex) btn.classList.add('active');
                btn.innerText = i + 1;
                btn.onclick = () => switchLevel(i);
                selector.appendChild(btn);
            }
        }

        function switchLevel(index) {
            currentLevelIndex = index;
            document.getElementById('currentLevelNum').innerText = index + 1;
            document.getElementById('nextLevelBtn').style.display = 'none';
            document.getElementById('message').innerText = '';
            initLevelSelector();
            initGrid();
        }

        function initGrid() {
            currentLevelData = buildLevelData(currentLevelIndex);
            gridElement.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cellData = currentLevelData.grid[r][c];
                    const cellDiv = document.createElement('div');
                    cellDiv.classList.add('cell');

                    if (cellData === null) {
                        cellDiv.classList.add('blocked');
                    } else {
                        if (cellData.n) {
                            const numberSpan = document.createElement('span');
                            numberSpan.classList.add('cell-number');
                            numberSpan.innerText = cellData.n;
                            cellDiv.appendChild(numberSpan);
                        }

                        const input = document.createElement('input');
                        input.setAttribute('maxlength', '1');
                        input.dataset.row = r;
                        input.dataset.col = c;
                        
                        input.addEventListener('input', (e) => {
                            if (e.target.value.length === 1) {
                                const nextInput = gridElement.querySelector(`input[data-row="${r}"][data-col="${c+1}"]`) ||
                                                  gridElement.querySelector(`input[data-row="${r+1}"][data-col="${c}"]`);
                                if (nextInput) nextInput.focus();
                            }
                        });

                        cellDiv.appendChild(input);
                    }
                    gridElement.appendChild(cellDiv);
                }
            }

            document.getElementById('horizontalClues').innerHTML = currentLevelData.h.map(item => `<li>${item}</li>`).join('');
            document.getElementById('verticalClues').innerHTML = currentLevelData.v.map(item => `<li>${item}</li>`).join('');
        }

        function checkCrossword() {
            let allCorrect = true;
            let filledCount = 0;
            const inputs = gridElement.querySelectorAll('input');

            inputs.forEach(input => {
                const r = input.dataset.row;
                const c = input.dataset.col;
                const correctLetter = currentLevelData.grid[r][c].l;
                const userLetter = input.value.toUpperCase();

                if (userLetter !== '') {
                    filledCount++;
                    if (userLetter === correctLetter) {
                        input.style.color = '#38bdf8';
                    } else {
                        input.style.color = '#f43f5e';
                        allCorrect = false;
                    }
                } else {
                    allCorrect = false;
                }
            });

            const message = document.getElementById('message');
            if (filledCount === 0) {
                message.style.color = '#fbbf24';
                message.innerText = 'Заполните пустые поля!';
            } else if (allCorrect) {
                message.style.color = '#34d399';
                message.innerText = 'Отлично! Уровень успешно пройден!';
                if (currentLevelIndex < totalLevels - 1) {
                    document.getElementById('nextLevelBtn').style.display = 'block';
                }
            } else {
                message.style.color = '#f43f5e';
                message.innerText = 'Есть ошибки в буквах. Проверьте написание!';
            }
        }

        function resetCurrentLevel() {
            const inputs = gridElement.querySelectorAll('input');
            inputs.forEach(input => {
                input.value = '';
                input.style.color = '#f8fafc';
            });
            document.getElementById('message').innerText = '';
            document.getElementById('nextLevelBtn').style.display = 'none';
        }

        function nextLevel() {
            if (currentLevelIndex < totalLevels - 1) {
                switchLevel(currentLevelIndex + 1);
            }
        }

        initLevelSelector();
        initGrid();
    </script>
</body>
</html>
