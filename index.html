<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Любовный пазл</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #160b20, #35102f, #120916);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.game {
    width: min(94vw, 650px);
    text-align: center;
    padding: 25px 15px;
}

h1 {
    font-size: 38px;
    margin: 5px 0;
}

.subtitle {
    color: #d8b9d5;
    margin-bottom: 20px;
}

.info {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,.08);
    padding: 13px 18px;
    border-radius: 15px;
    margin-bottom: 15px;
}

.board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: auto;
}

.card {
    aspect-ratio: 1;
    border: none;
    border-radius: 16px;
    background: linear-gradient(145deg, #ff477e, #9c285d);
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(0,0,0,.35);
    transition: .25s;
    position: relative;
    transform-style: preserve-3d;
}

.card:hover {
    transform: translateY(-3px);
}

.card.open {
    background: #fff;
    color: #39152f;
    transform: rotateY(180deg);
}

.card.matched {
    background: linear-gradient(145deg, #55d68a, #238f59);
    transform: scale(.96);
    cursor: default;
}

.card span {
    opacity: 0;
    transition: .15s;
}

.card.open span,
.card.matched span {
    opacity: 1;
}

.message {
    min-height: 35px;
    margin: 18px 0 8px;
    font-size: 17px;
    color: #ffd6e7;
}

button.restart {
    border: none;
    padding: 12px 25px;
    border-radius: 30px;
    background: #ff477e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.win {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,4,12,.92);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.winBox {
    max-width: 450px;
    background: linear-gradient(145deg, #421536, #211024);
    padding: 35px 25px;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(255,71,126,.25);
}

.winBox h2 {
    font-size: 34px;
    margin-top: 0;
}

.heart {
    font-size: 65px;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.15);
    }
}

@media(max-width:450px) {
    h1 {
        font-size: 30px;
    }

    .board {
        gap: 7px;
    }

    .card {
        border-radius: 12px;
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="game">

    <h1>❤️ Любовный пазл</h1>
    <div class="subtitle">
        Найди все пары воспоминаний
    </div>

    <div class="info">
        <div>Ходы: <b id="moves">0</b></div>
        <div>Пары: <b id="pairs">0</b>/8</div>
    </div>

    <div class="board" id="board"></div>

    <div class="message" id="message">
        Иногда любовь — это умение замечать мелочи.
    </div>

    <button class="restart" onclick="startGame()">
        Начать заново
    </button>

</div>

<div class="win" id="win">
    <div class="winBox">
        <div class="heart">❤️</div>
        <h2>Ты собрал историю!</h2>
        <p id="finalText"></p>
        <button class="restart" onclick="startGame(); closeWin();">
            Играть ещё
        </button>
    </div>
</div>

<script>

const symbols = [
    "🌹", "🌹",
    "💌", "💌",
    "💍", "💍",
    "☕", "☕",
    "🌙", "🌙",
    "🎁", "🎁",
    "📸", "📸",
    "❤️", "❤️"
];

let firstCard = null;
let secondCard = null;
let locked = false;
let moves = 0;
let pairs = 0;

const messages = [
    "Хорошее начало ❤️",
    "Одна пара найдена!",
    "Похоже, ты умеешь замечать детали.",
    "Ещё немного...",
    "Любовь состоит из маленьких моментов.",
    "Не сдавайся ❤️",
    "Ты уже близко!",
    "Почти вся история собрана."
];

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function startGame() {

    const board = document.getElementById("board");

    board.innerHTML = "";

    firstCard = null;
    secondCard = null;
    locked = false;
    moves = 0;
    pairs = 0;

    document.getElementById("moves").textContent = moves;
    document.getElementById("pairs").textContent = pairs;
    document.getElementById("message").textContent =
        "Иногда любовь — это умение замечать мелочи.";

    const shuffled = shuffle([...symbols]);

    shuffled.forEach(symbol => {

        const card = document.createElement("button");

        card.className = "card";
        card.dataset.symbol = symbol;

        card.innerHTML = `
            <span>?</span>
        `;

        card.addEventListener("click", () => flipCard(card));

        board.appendChild(card);
    });
}

function flipCard(card) {

    if (locked) return;
    if (card === firstCard) return;
    if (card.classList.contains("matched")) return;

    card.classList.add("open");

    card.querySelector("span").textContent = card.dataset.symbol;

    if (!firstCard) {
        firstCard = card;
        return;
    }

    secondCard = card;
    moves++;

    document.getElementById("moves").textContent = moves;

    if (firstCard.dataset.symbol === secondCard.dataset.symbol) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        pairs++;

        document.getElementById("pairs").textContent = pairs;

        document.getElementById("message").textContent =
            messages[Math.min(pairs - 1, messages.length - 1)];

        firstCard = null;
        secondCard = null;

        if (pairs === 8) {
            setTimeout(showWin, 700);
        }

    } else {

        locked = true;

        document.getElementById("message").textContent =
            "Эти воспоминания не совпали... попробуй ещё.";

        setTimeout(() => {

            firstCard.classList.remove("open");
            secondCard.classList.remove("open");

            firstCard.querySelector("span").textContent = "?";
            secondCard.querySelector("span").textContent = "?";

            firstCard = null;
            secondCard = null;
            locked = false;

        }, 850);
    }
}

function showWin() {

    document.getElementById("finalText").textContent =
        `История собрана за ${moves} ходов. Иногда, чтобы найти любовь, нужно просто не переставать искать. ❤️`;

    document.getElementById("win").style.display = "flex";
}

function closeWin() {
    document.getElementById("win").style.display = "none";
}

startGame();

</script>

</body>
</html>
