<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #131c2e;
            --surface-card: #19263f;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2a3b5c;
            --success: #10b981;
            --error: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Выбор уровней */
        .levels-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            max-width: 600px;
            width: 100%;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .levels-container::-webkit-scrollbar {
            display: none;
        }

        .level-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .level-chip:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .level-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        /* Игровое поле */
        .game-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .grid-box {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            aspect-ratio: 1;
            gap: 4px;
            background: var(--border);
            padding: 4px;
            border-radius: 12px;
            max-width: 360px;
            margin: 0 auto;
            width: 100%;
        }

        .cell {
            position: relative;
            background: #060913;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.empty {
            background: var(--surface);
            opacity: 0.15;
            pointer-events: none;
        }

        .cell input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }

        .cell input:focus {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 6px;
        }

        .cell-num {
            position: absolute;
            top: 3px;
            left: 4px;
            font-size: 9px;
            font-weight: 700;
            color: var(--accent);
            pointer-events: none;
        }

        /* Вопросы */
        .clues-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .clues-section h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .clues-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .clues-list li {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--surface-card);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .clues-list li b {
            color: var(--text);
        }

        /* Кнопки */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--surface-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            color: var(--text);
            border-color: var(--text-muted);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        #status-msg {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1> crossword by moonx </h1>
        <p>Уровень <span id="current-lvl-num">1</span> из 15</p>
    </header>

    <div class="levels-container" id="levels-bar"></div>

    <div class="game-wrapper">
        <div class="grid-box" id="crossword-grid"></div>

        <div class="clues-section">
            <div>
                <h3>По горизонтали</h3>
                <ul class="clues-list" id="horizontal-clues"></ul>
            </div>
            <div>
                <h3>По вертикали</h3>
                <ul class="clues-list" id="vertical-clues"></ul>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="clearGrid()">Очистить</button>
            <button class="btn btn-primary" onclick="checkGrid()">Проверить</button>
            <button class="btn btn-success" id="next-btn" style="display:none;" onclick="nextLevel()">Далее ➔</button>
        </div>
        <div id="status-msg"></div>
    </div>

    <script>
        // Четкая база данных с заранее просчитанными пересечениями без багов
        const levelsData = [
            {
                // Уровень 1: КНИГА / СТОЛ / КЛАСС / АТЛАС
                // Сетка 6х6
                h: [
                    { id: 1, text: "Печатное издание с текстом.", row: 0, col: 0, word: "КНИГА" },
                    { id: 2, text: "Предмет мебели для работы.", row: 3, col: 1, word: "СТОЛ" }
                ],
                v: [
                    { id: 3, text: "Школьное помещение для уроков.", row: 0, col: 0, word: "КЛАСС" },
                    { id: 4, text: "Сборник географических карт.", row: 0, col: 4, word: "АТЛАС" }
                ]
            },
            {
                // Уровень 2
                h: [
                    { id: 1, text: "Самое холодное время года.", row: 0, col: 0, word: "ЗИМА" },
                    { id: 2, text: "Замерзшая вода.", row: 3, col: 1, word: "ЛЕД" }
                ],
                v: [
                    { id: 3, text: "Гладкая отражающая поверхность.", row: 0, col: 0, word: "ЗЕРКАЛО" },
                    { id: 4, text: "Легковой автомобиль.", row: 0, col: 3, word: "АВТО" }
                ]
            },
            {
                // Уровень 3
                h: [
                    { id: 1, text: "Самое теплое время года.", row: 0, col: 0, word: "ЛЕТО" },
                    { id: 2, text: "Сильный зной в полдень.", row: 3, col: 1, word: "ЖАРА" }
                ],
                v: [
                    { id: 3, text: "Поле с сочной травой.", row: 0, col: 0, word: "ЛУГ" },
                    { id: 4, text: "Зеленый покров земли.", row: 0, col: 3, word: "ТРАВА" }
                ]
            },
            {
                // Уровень 4
                h: [
                    { id: 1, text: "Естественный водный поток.", row: 0, col: 0, word: "РЕКА" },
                    { id: 2, text: "Сооружение через преграду.", row: 3, col: 1, word: "МОСТ" }
                ],
                v: [
                    { id: 3, text: "Животное в воде с жабрами.", row: 0, col: 0, word: "РЫБА" },
                    { id: 4, text: "Канал для отвода воды.", row: 0, col: 3, word: "ТРУБА" }
                ]
            },
            {
                // Уровень 5
                h: [
                    { id: 1, text: "Равнина под посев.", row: 0, col: 0, word: "ПОЛЕ" },
                    { id: 2, text: "Зерновая хлебная культура.", row: 3, col: 1, word: "РОЖЬ" }
                ],
                v: [
                    { id: 3, text: "Пернатое с крыльями.", row: 0, col: 0, word: "ПТИЦА" },
                    { id: 4, text: "Музыкальный театр.", row: 0, col: 3, word: "ОПЕРА" }
                ]
            },
            {
                // Уровень 6
                h: [
                    { id: 1, text: "Искусство киноэкрана.", row: 0, col: 0, word: "КИНО" },
                    { id: 2, text: "Театральный жанр.", row: 3, col: 1, word: "ДРАМ" }
                ],
                v: [
                    { id: 3, text: "Защитный шлем.", row: 0, col: 0, word: "КАСКА" },
                    { id: 4, text: "Художественный тип.", row: 0, col: 3, word: "ОБРАЗ" }
                ]
            },
            {
                // Уровень 7
                h: [
                    { id: 1, text: "Управляет самолетом.", row: 0, col: 0, word: "ПИЛОТ" },
                    { id: 2, text: "Орган управления.", row: 3, col: 1, word: "РУЛЬ" }
                ],
                v: [
                    { id: 3, text: "Мелкие сыпучие крупинки.", row: 0, col: 0, word: "ПЕСОК" },
                    { id: 4, text: "Машина с шашечками.", row: 0, col: 4, word: "ТАКСИ" }
                ]
            },
            {
                // Уровень 8
                h: [
                    { id: 1, text: "Ученический стол.", row: 0, col: 0, word: "ПАРТА" },
                    { id: 2, text: "Брусок для доски.", row: 3, col: 1, word: "МЕЛ" }
                ],
                v: [
                    { id: 3, text: "Воинская часть.", row: 0, col: 0, word: "ПОЛК" },
                    { id: 4, text: "Дорожка с деревьями.", row: 0, col: 4, word: "АЛЛЕЯ" }
                ]
            },
            {
                // Уровень 9
                h: [
                    { id: 1, text: "Оттенок, краска.", row: 0, col: 0, word: "ЦВЕТ" },
                    { id: 2, text: "Королева цветов.", row: 3, col: 1, word: "РОЗА" }
                ],
                v: [
                    { id: 3, text: "Сосуд для букета.", row: 0, col: 0, word: "ВАЗА" },
                    { id: 4, text: "Главное место.", row: 0, col: 4, word: "ЦЕНТР" }
                ]
            },
            {
                // Уровень 10
                h: [
                    { id: 1, text: "Умный сообразительный человек.", row: 0, col: 0, word: "УМНИК" },
                    { id: 2, text: "Источник знаний.", row: 3, col: 1, word: "КНИГА" }
                ],
                v: [
                    { id: 3, text: "Черное горное топливо.", row: 0, col: 0, word: "УГОЛЬ" },
                    { id: 4, text: "Быстроходное суднышко.", row: 0, col: 4, word: "КАТЕР" }
                ]
            }
        ];

        let activeLevel = 0;
        let gridMatrix = [];

        function initLevelsBar() {
            const bar = document.getElementById('levels-bar');
            bar.innerHTML = '';
            levelsData.forEach((_, idx) => {
                let chip = document.createElement('div');
                chip.className = `level-chip ${idx === activeLevel ? 'active' : ''}`;
                chip.innerText = `Уровень ${idx + 1}`;
                chip.onclick = () => loadLevel(idx);
                bar.appendChild(chip);
            });
        }

        function loadLevel(idx) {
            activeLevel = idx;
            document.getElementById('current-lvl-num').innerText = idx + 1;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('status-msg').innerText = '';
            initLevelsBar();
            buildMatrix(levelsData[idx]);
            renderUI();
        }

        function buildMatrix(data) {
            // Создаем пустую матрицу 6x6
            gridMatrix = Array(6).fill(null).map(() => Array(6).fill(null));

            // Заполняем горизонтальные слова
            data.h.forEach(item => {
                for (let i = 0; i < item.word.length; i++) {
                    let r = item.row;
                    let c = item.col + i;
                    if (!gridMatrix[r][c]) {
                        gridMatrix[r][c] = { letter: item.word[i], num: (i === 0 ? item.id : null) };
                    } else {
                        if (i === 0) gridMatrix[r][c].num = item.id;
                        gridMatrix[r][c].letter = item.word[i];
                    }
                }
            });

            // Заполняем вертикальные слова
            data.v.forEach(item => {
                for (let i = 0; i < item.word.length; i++) {
                    let r = item.row + i;
                    let c = item.col;
                    if (!gridMatrix[r][c]) {
                        gridMatrix[r][c] = { letter: item.word[i], num: (i === 0 ? item.id : null) };
                    } else {
                        if (i === 0) gridMatrix[r][c].num = item.id;
                        gridMatrix[r][c].letter = item.word[i];
                    }
                }
            });
        }

        function renderUI() {
            const gridEl = document.getElementById('crossword-grid');
            gridEl.innerHTML = '';

            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 6; c++) {
                    let cellData = gridMatrix[r][c];
                    let cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';

                    if (cellData === null) {
                        cellDiv.classList.add('empty');
                    } else {
                        if (cellData.num) {
                            let numSpan = document.createElement('span');
                            numSpan.className = 'cell-num';
                            numSpan.innerText = cellData.num;
                            cellDiv.appendChild(numSpan);
                        }

                        let input = document.createElement('input');
                        input.maxLength = 1;
                        input.dataset.r = r;
                        input.dataset.c = c;

                        // Автоматический переход к следующей ячейке
                        input.addEventListener('input', (e) => {
                            if (e.target.value.length === 1) {
                                let nextInput = gridEl.querySelector(`input[data-r="${r}"][data-c="${c+1}"]`) ||
                                                gridEl.querySelector(`input[data-r="${r+1}"][data-c="${c}"]`);
                                if (nextInput) nextInput.focus();
                            }
                        });

                        cellDiv.appendChild(input);
                    }
                    gridEl.appendChild(cellDiv);
                }
            }

            // Заполняем подсказки
            const curData = levelsData[activeLevel];
            document.getElementById('horizontal-clues').innerHTML = curData.h.map(i => `<li><b>${i.id}.</b> ${i.text}</li>`).join('');
            document.getElementById('vertical-clues').innerHTML = curData.v.map(i => `<li><b>${i.id}.</b> ${i.text}</li>`).join('');
        }

        function checkGrid() {
            let inputs = document.querySelectorAll('.grid-box input');
            let allCorrect = true;
            let filledCount = 0;

            inputs.forEach(input => {
                let r = input.dataset.r;
                let c = input.dataset.c;
                let correctLetter = gridMatrix[r][c].letter;
                let userVal = input.value.toUpperCase();

                if (userVal !== '') {
                    filledCount++;
                    if (userVal === correctLetter) {
                        input.style.color = 'var(--success)';
                    } else {
                        input.style.color = 'var(--error)';
                        allCorrect = false;
                    }
                } else {
                    allCorrect = false;
                }
            });

            let msg = document.getElementById('status-msg');
            if (filledCount === 0) {
                msg.style.color = '#f59e0b';
                msg.innerText = 'Заполните пустые клетки!';
            } else if (allCorrect) {
                msg.style.color = 'var(--success)';
                msg.innerText = 'Отлично! Уровень успешно пройден!';
                if (activeLevel < levelsData.length - 1) {
                    document.getElementById('next-btn').style.display = 'block';
                }
            } else {
                msg.style.color = 'var(--error)';
                msg.innerText = 'Есть ошибки, проверьте буквы.';
            }
        }

        function clearGrid() {
            document.querySelectorAll('.grid-box input').forEach(input => {
                input.value = '';
                input.style.color = 'white';
            });
            document.getElementById('status-msg').innerText = '';
            document.getElementById('next-btn').style.display = 'none';
        }

        function nextLevel() {
            if (activeLevel < levelsData.length - 1) {
                loadLevel(activeLevel + 1);
            }
        }

        // Запуск
        loadLevel(0);
    </script>
</body>
</html>
